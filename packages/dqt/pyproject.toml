[project]
name = "dqt"
version = "0.1.0"
description = "Data quality, observability, semantic, and causality library"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["data-quality", "observability", "anomaly-detection", "causality"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "pyod>=1.1",
    "diptest>=0.6",
    "river>=0.21",
    "structlog>=24.0",
    "pydantic>=2.7",
    "ibis-framework>=9.0",
    "duckdb>=0.9",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9", "ibis-framework[postgres]>=9.0"]
causal   = ["tigramite>=0.7", "dowhy>=0.11", "causal-learn>=0.1"]
forecast = ["prophet>=1.1", "stumpy>=1.4"]
deep     = ["torch>=2.3", "pyod[deep]>=1.1"]
explain  = ["shap>=0.45", "pgmpy>=0.1"]
files    = ["openpyxl>=3.0", "pyarrow>=14.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dqt"]

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"><title>{{ title }}</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <style>
    body{font-family:'JetBrains Mono',monospace;background:#0d0d0d;color:#e0e0e0;margin:0}
    nav{background:#111;border-bottom:1px solid #222;padding:0 24px;display:flex}
    nav a{display:inline-block;padding:12px 16px;color:#888;text-decoration:none;font-size:12px;border-bottom:2px solid transparent}
    nav a.active,nav a:hover{color:#9DD0B0;border-bottom-color:#9DD0B0}
    #graph{width:100%;height:calc(100vh - 45px)}
    .node circle{fill:#1e3a2f;stroke:#9DD0B0;stroke-width:1;cursor:pointer}
    .node circle:hover{fill:#2a5040}
    .node text{fill:#ccc;font-size:9px;pointer-events:none}
    .link{stroke:#333;stroke-width:1}
    #tooltip{position:fixed;background:#111;border:1px solid #333;padding:6px 10px;font-size:11px;pointer-events:none;display:none;color:#e0e0e0}
  </style>
</head>
<body>
<nav>
  <a href="/" {% if active=='checks' %}class="active"{% endif %}>checks</a>
  <a href="/incidents" {% if active=='incidents' %}class="active"{% endif %}>incidents</a>
  <a href="/profile" {% if active=='profile' %}class="active"{% endif %}>profile</a>
  <a href="/causality" {% if active=='causality' %}class="active"{% endif %}>causality</a>
  <a href="/lineage" {% if active=='lineage' %}class="active"{% endif %}>lineage</a>
</nav>
<div id="tooltip"></div>
<svg id="graph"></svg>
<script>
const nodes = {{ nodes_json | safe }};
const edges = {{ edges_json | safe }};
const svg = d3.select("#graph");
const W = window.innerWidth, H = window.innerHeight - 45;
svg.attr("viewBox", `0 0 ${W} ${H}`);
if (nodes.length === 0) {
  svg.append("text").attr("x", 24).attr("y", 40).attr("fill","#555").attr("font-size","12px")
     .text("No lineage graph — pass lineage_graph= to build_app().");
} else {
  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(edges).id(d => d.id).distance(90))
    .force("charge", d3.forceManyBody().strength(-250))
    .force("center", d3.forceCenter(W/2, H/2));
  svg.append("defs").append("marker").attr("id","arr")
    .attr("viewBox","0 -5 10 10").attr("refX",22).attr("refY",0)
    .attr("markerWidth",6).attr("markerHeight",6).attr("orient","auto")
    .append("path").attr("d","M0,-5L10,0L0,5").attr("fill","#444");
  const link = svg.append("g").selectAll("line").data(edges).join("line")
    .attr("class","link").attr("marker-end","url(#arr)");
  const drag = d3.drag()
    .on("start",(e,d)=>{if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y})
    .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y})
    .on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null});
  const node = svg.append("g").selectAll("g").data(nodes).join("g").attr("class","node").call(drag);
  node.append("circle").attr("r",16);
  node.append("text").attr("dy",4).attr("text-anchor","middle")
    .text(d => d.label.length>14 ? d.label.slice(0,13)+"…" : d.label);
  const tip = document.getElementById("tooltip");
  node.on("mouseover",(e,d)=>{
    tip.style.display="block";
    tip.style.left=e.clientX+14+"px";tip.style.top=e.clientY+14+"px";
    tip.textContent=d.table+"."+d.label;
  }).on("mouseout",()=>{tip.style.display="none"});
  sim.on("tick",()=>{
    link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
        .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    node.attr("transform",d=>`translate(${d.x},${d.y})`);
  });
}
</script>
</body>
</html>

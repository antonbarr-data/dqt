[project]
name = "dqt-cli"
version = "0.1.0"
description = "dqt command-line interface"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "dqt>=0.1.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
dqt = "dqt_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dqt_cli"]

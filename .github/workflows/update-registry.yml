name: Update registry.json

on:
  push:
    branches: [main]
    paths:
      - "packages/dqt/src/dqt/algorithms/**"
      - "packages/dqt/src/dqt/algorithms/_scales.py"
      - "scripts/generate_registry.py"

jobs:
  update-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: '3.12'

      - name: Install dqt library
        run: uv sync --frozen --package dqtlib

      - name: Generate docs/registry.json
        run: uv run python scripts/generate_registry.py

      - name: Commit registry.json if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/registry.json
          if git diff --cached --quiet; then
            echo "registry.json unchanged — nothing to commit"
          else
            git commit -m "chore: auto-update docs/registry.json [skip ci]"
            git push
          fi

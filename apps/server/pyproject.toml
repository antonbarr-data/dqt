[project]
name = "dqt-server"
version = "0.1.0"
description = "dqt FastAPI service"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "cryptography>=42.0",
    "arq>=0.26",
    "redis[hiredis]>=5.0",
    "slowapi>=0.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "anthropic>=0.28",
    "email-validator>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dqt_server"]

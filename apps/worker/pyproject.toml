[project]
name = "dqt-worker"
version = "0.1.0"
description = "dqt arq worker"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "dqt-server>=0.1.0",
    "arq>=0.26",
]

[tool.uv.sources]
dqt-server = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dqt_worker"]

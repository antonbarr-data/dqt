# nixpacks build config for dqt-web (Next.js 14).
# Uses npm because pnpm-lock.yaml lives at the monorepo root;
# Railway deploys this service from apps/web/ which doesn't have a lock file.

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install --legacy-peer-deps"]

[phases.build]
cmds = ["npm run build"]

[start]
# CI=true triggers output:"standalone" in next.config.mjs; standalone server reads PORT env var
cmd = "PORT=$PORT node .next/standalone/server.js"
